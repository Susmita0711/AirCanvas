<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070c" />
  <title>Air Canvas — Gesture Drawing HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <div class="brand-title">Air Canvas</div>
          <div class="brand-tagline">gesture-driven visual workspace</div>
        </div>
      </div>
      <div class="status-cluster" aria-live="polite">
        <div class="status-pill" id="modelStatus"><i></i><span>model · loading</span></div>
        <div class="status-pill" id="handStatus"><i></i><span>hand · searching</span></div>
        <div class="status-pill accent" id="gestureStatus"><i></i><span>idle · open palm</span></div>
      </div>
    </header>

    <main class="workspace">
      <section class="stage-wrap">
        <div class="stage" id="stage">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="drawCanvas" aria-label="Air Canvas drawing surface"></canvas>
          <canvas id="cursorCanvas" aria-hidden="true"></canvas>

          <div class="viewfinder vf-tl"></div>
          <div class="viewfinder vf-tr"></div>
          <div class="viewfinder vf-bl"></div>
          <div class="viewfinder vf-br"></div>
          <div class="stage-meta"><span>LIVE / CAM 01</span><span id="resolutionLabel">— × —</span></div>

          <div class="loading-overlay" id="loadingOverlay">
            <div class="loader-ring"></div>
            <div class="loading-title" id="loadingTitle">INITIALIZING CAMERA</div>
            <div class="loading-copy" id="loadingCopy">Requesting webcam access…</div>
          </div>

          <div class="error-overlay hidden" id="errorOverlay">
            <div class="error-icon">!</div>
            <div class="loading-title" id="errorTitle">CAMERA UNAVAILABLE</div>
            <div class="loading-copy" id="errorCopy"></div>
            <button class="ghost-button" id="retryCamera">Retry camera</button>
          </div>
        </div>
      </section>

      <aside class="palette-dock glass" aria-label="Color palette">
        <div class="dock-label">COLOR</div>
        <div class="swatches" id="swatches">
          <button class="swatch active" data-color="#ef4444" style="--swatch:#ef4444" aria-label="Red"></button>
          <button class="swatch" data-color="#f97316" style="--swatch:#f97316" aria-label="Orange"></button>
          <button class="swatch" data-color="#facc15" style="--swatch:#facc15" aria-label="Yellow"></button>
          <button class="swatch" data-color="#22c55e" style="--swatch:#22c55e" aria-label="Green"></button>
          <button class="swatch" data-color="#3b82f6" style="--swatch:#3b82f6" aria-label="Blue"></button>
          <button class="swatch" data-color="#8b5cf6" style="--swatch:#8b5cf6" aria-label="Purple"></button>
          <button class="swatch" data-color="#ec4899" style="--swatch:#ec4899" aria-label="Pink"></button>
          <button class="swatch" data-color="#ffffff" style="--swatch:#ffffff" aria-label="White"></button>
        </div>
      </aside>
    </main>

    <footer class="controlbar glass">
      <div class="control-group tool-group">
        <span class="control-label">TOOL</span>
        <div class="segmented" id="toolSelector">
          <button class="tool-button active" data-tool="pen">Pen</button>
          <button class="tool-button" data-tool="flower">Flower</button>
        </div>
      </div>

      <div class="control-group toggle-group">
        <span class="control-label">DRAWING</span>
        <button class="toggle" id="drawingToggle" role="switch" aria-checked="true">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">ON</span>
        </button>
      </div>

      <div class="control-group size-group">
        <div class="size-head"><span class="control-label">BRUSH</span><span class="mono-value" id="sizeValue">12 PX</span></div>
        <input id="brushSize" type="range" min="2" max="40" value="12" />
      </div>

      <button class="clear-button" id="clearCanvas">Clear canvas</button>
    </footer>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
